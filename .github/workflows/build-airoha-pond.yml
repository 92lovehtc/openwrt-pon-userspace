name: build-airoha-pond

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install aarch64 cross linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Patch sources
        run: |
          python3 - <<'PY'
          p = "airoha-pon-daemons/src/src/oam/ctc.rs"
          s = open(p).read()
          a = "const LEAF_ONU_CAPABILITIES_3: u16 = 0x000c;"
          assert a in s
          s = s.replace(a, a + "\nconst LEAF_ONU_AUTH_INFO: u16 = 0x0005;", 1)
          b = "LEAF_ONU_CAPABILITIES_3 if object.is_none() => Ok(vec![0, 0, 1]),"
          assert b in s
          s = s.replace(
              b,
              b
              + "\n            LEAF_ONU_AUTH_INFO if object.is_none() => Ok(Vec::from(["
              + "\n                0x31, 0x4c, 0x7e, 0x0d, 0x19, 0xc8, 0x3f, 0x67, 0x00, 0x37,"
              + "\n            ])),",
              1,
          )
          open(p, "w").write(s)

          p = "airoha-pon-daemons/src/src/oam/config.rs"
          s = open(p).read()
          c = "pub fn onu_serial(&self, source_mac: [u8; 6])"
          assert c in s
          s = s.replace(c, "pub fn onu_serial(&self, _source_mac: [u8; 6])", 1)
          d = "serial[4..].copy_from_slice(&source_mac[2..]);"
          assert d in s
          s = s.replace(d, "serial[4..].copy_from_slice(&fixed_width(&self.model, 4));", 1)
          open(p, "w").write(s)
          print("patched OK")
          PY

      - name: Build
        working-directory: airoha-pon-daemons/src
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
        run: |
          rustup target add aarch64-unknown-linux-musl
          cargo build --release --target aarch64-unknown-linux-musl
          file target/aarch64-unknown-linux-musl/release/airoha-pond

      - uses: actions/upload-artifact@v4
        with:
          name: airoha-pond-aarch64-musl
          path: airoha-pon-daemons/src/target/aarch64-unknown-linux-musl/release/airoha-pond
          if-no-files-found: error
