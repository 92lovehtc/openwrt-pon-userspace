name: build-airoha-pond

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install aarch64 cross linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Patch sources
        run: |
          python3 - <<'PY'
          p = "airoha-pon-daemons/src/src/oam/ctc.rs"
          s = open(p).read()

          a = "const LEAF_ONU_CAPABILITIES_3: u16 = 0x000c;"
          assert a in s, "const anchor"
          s = s.replace(a, a + "\nconst LEAF_ONU_AUTH_INFO: u16 = 0x0005;", 1)

          b = "LEAF_ONU_CAPABILITIES_3 if object.is_none() => Ok(vec![0, 0, 1]),"
          assert b in s, "match anchor"
          s = s.replace(
              b,
              b
              + "\n            LEAF_ONU_AUTH_INFO if object.is_none() => Ok(Vec::from(["
              + "\n                0x31, 0x4c, 0x7e, 0x0d, 0x19, 0xc8, 0x3f, 0x67, 0x00, 0x37,"
              + "\n            ])),",
              1,
          )

          sn_old = "            LEAF_ONU_SN if object.is_none() => Ok(config.onu_serial(source_mac).to_vec()),"
          assert sn_old in s, "sn anchor"
          sn_new = "\n".join([
              "            LEAF_ONU_SN if object.is_none() => {",
              "                let mut value = Vec::with_capacity(54);",
              "                value.extend_from_slice(&config.onu_serial(source_mac));",
              "                value.extend_from_slice(&source_mac);",
              "                value.extend_from_slice(&[0, 0]);",
              "                value.extend_from_slice(&fixed_width(&config.hardware_version, 6));",
              "                value.extend_from_slice(&[0, 0, 0]);",
              "                value.extend_from_slice(&fixed_width(&config.software_version, 13));",
              "                value.extend_from_slice(&[0, 0]);",
              "                value.extend_from_slice(b\"6838_oren_0001\");",
              "                Ok(value)",
              "            }",
          ])
          s = s.replace(sn_old, sn_new, 1)

          ver_old = "Ok(config.firmware_version.iter().copied().take(127).collect())"
          assert ver_old in s, "version anchor"
          s = s.replace(ver_old, "Ok(vec![0x00, 0x01])", 1)

          open(p, "w").write(s)

          p2 = "airoha-pon-daemons/src/src/oam/config.rs"
          s2 = open(p2).read()
          c = "pub fn onu_serial(&self, source_mac: [u8; 6])"
          assert c in s2, "onu_serial anchor"
          s2 = s2.replace(c, "pub fn onu_serial(&self, _source_mac: [u8; 6])", 1)
          d = "serial[4..].copy_from_slice(&source_mac[2..]);"
          assert d in s2, "mac tail anchor"
          s2 = s2.replace(d, "serial[4..].copy_from_slice(&fixed_width(&self.model, 4));", 1)
          open(p2, "w").write(s2)

          print("patched OK")
          PY

      - name: Build
        working-directory: airoha-pon-daemons/src
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
        run: |
          rustup target add aarch64-unknown-linux-musl
          cargo build --release --target aarch64-unknown-linux-musl
          file target/aarch64-unknown-linux-musl/release/airoha-pond

      - uses: actions/upload-artifact@v4
        with:
          name: airoha-pond-aarch64-musl
          path: airoha-pon-daemons/src/target/aarch64-unknown-linux-musl/release/airoha-pond
          if-no-files-found: error
