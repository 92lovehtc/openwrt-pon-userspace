name: build-airoha-pond

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: rustc --version && cargo --version

      - name: Add aarch64 musl target
        run: rustup target add aarch64-unknown-linux-musl

      - name: Apply c7/0005 patch
        run: |
          git apply --check ctc-0005.patch
          git apply ctc-0005.patch
          git --no-pager diff --stat

      - name: Build airoha-pond
        working-directory: airoha-pon-daemons/src
        run: |
          cargo build --release --target aarch64-unknown-linux-musl
          file target/aarch64-unknown-linux-musl/release/airoha-pond

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: airoha-pond-aarch64-musl
          path: airoha-pon-daemons/src/target/aarch64-unknown-linux-musl/release/airoha-pond
          if-no-files-found: error
